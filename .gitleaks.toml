[extend]
useDefault = true

[allowlist]
description = "Public on-chain and attestation values"
regexTarget = "match"
regexes = [
  # Mainnet USDC token account id (public implicit account). A prefix: the generic rule can capture a truncated id.
  '''17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e''',
  # NEAR AI attestation public keys.
  '''(ohttp_key_config|key_config|signing_key)\\?"\s*:\s*\\?"[0-9a-fA-Fx]+''',
]
