[package]
name = "sledgit-factory"
description = "Sledgit vault factory: creates keyless vaults on one shared, hash-pinned vault code."
version = "0.2.0"
repository = "https://github.com/sledgit/sledgit"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-330 reproducible build, as generated by cargo near new (cargo-near 0.22).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
# Pinned: near-sdk 5.30 imports the host function promise_batch_action_universal_state_init, which only exists
# from nearcore 2.14 (protocol 88); mainnet runs 2.13.4 (protocol 86) as of 2026-10-28, where 5.30 contracts
# fail with "Link Error: unknown or invalid import". Move to 5.30 once mainnet is on 2.14. See tests/README.md.
near-sdk = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }


[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
